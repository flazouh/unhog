name: Release

# Builds, signs, notarizes, and publishes a release from a hosted runner so that
# no signing or notarization work happens on a developer's Mac. The same scripts
# run here as locally, so both paths enforce the same gates.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          # The release scripts compare the built commit against origin/main, so
          # they need real history rather than a shallow clone.
          fetch-depth: 0

      - name: Confirm the tag matches the bundle version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $version." >&2
            exit 1
          fi

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/unhog-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # Without an explicit partition list, codesign blocks on a GUI prompt
          # for the private key that a headless runner can never answer.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          rm -f "$certificate"

      - name: Write the notary API key
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "UNHOG_NOTARY_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        env:
          UNHOG_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          UNHOG_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UNHOG_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          UNHOG_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/release-app.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-github-release.sh

      # Runs after the release so the URL the feed advertises already resolves.
      # A feed published first would point installed copies at a download that
      # does not exist yet.
      - name: Publish the Sparkle update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/publish-appcast.sh

      - name: Upload the artifact for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unhog-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/*.commit
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/certificate.p12"
          security list-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/unhog-signing.keychain-db" || true
